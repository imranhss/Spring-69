<div class="min-vh-100 bg-light">

  <nav class="navbar navbar-dark bg-warning px-4">
    <span class="navbar-brand fw-bold text-dark">
      <i class="bi bi-person-fill me-2"></i>Customer Portal
    </span>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-dark small">{{ user?.name }}</span>
      <button class="btn btn-outline-dark btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </nav>

  <div class="container py-5">

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body d-flex align-items-center gap-4 p-4">
        <div
          class="rounded-circle bg-warning d-flex align-items-center justify-content-center text-dark fw-bold overflow-hidden"
          style="width: 72px; height: 72px; font-size: 1.8rem;">

          <img *ngIf="customer.image" [src]="imageUrl + customer.image" alt="Customer Image"
            class="w-100 h-100 object-fit-cover">

          

        </div>
        <div>
          <h5 class="fw-bold mb-0">{{ user?.name }}</h5>
          <div class="text-muted small">{{ user?.email }}</div>
          <div class="text-muted small"><i class="bi bi-telephone-fill me-1"></i>{{ user?.phone }}</div>
          <span class="badge bg-warning text-dark mt-1">{{ user?.role }}</span>
        </div>
      </div>
    </div>

    <h6 class="text-uppercase text-muted fw-bold mb-3 small">My Parcels</h6>
    <div class="row row-cols-2 g-3">

      <div class="col">
        <div class="card border-0 shadow-sm text-center p-4 h-100">
          <i class="bi bi-plus-circle-fill fs-2 text-warning mb-2"></i>
          <div class="fw-semibold">Send Parcel</div>
        </div>
      </div>

      <div class="col">
        <div class="card border-0 shadow-sm text-center p-4 h-100">
          <i class="bi bi-truck fs-2 text-primary mb-2"></i>
          <div class="fw-semibold">Track Parcel</div>
        </div>
      </div>

    </div>
  </div>
</div>
