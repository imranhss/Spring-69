<div class="min-vh-100 bg-light">

  <nav class="navbar navbar-dark bg-success px-4">
    <span class="navbar-brand fw-bold">
      <i class="bi bi-person-badge-fill me-2"></i>Agent Portal
    </span>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-white small">{{ user?.name }}</span>
      <button class="btn btn-outline-light btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </nav>

  <div class="container py-5">

    <!-- Profile Card -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body d-flex align-items-center gap-4 p-4">
        <div
          class="rounded-circle bg-warning d-flex align-items-center justify-content-center text-dark fw-bold overflow-hidden"
          style="width: 72px; height: 72px; font-size: 1.8rem;">

          <img *ngIf="agent?.image" [src]="imageUrl + agent?.image" class="w-100 h-100 object-fit-cover" />

          <ng-template #defaultImg>
            <div class="d-flex align-items-center justify-content-center w-100 h-100 bg-light">
              <i class="bi bi-person fs-2"></i>
            </div>
          </ng-template>


        </div>
        <div>
          <h5 class="fw-bold mb-0">{{ user?.name }}</h5>
          <div class="text-muted small">{{ user?.email }}</div>
          <div class="text-muted small"><i class="bi bi-telephone-fill me-1"></i>{{ user?.phone }}</div>
          <span class="badge bg-success mt-1">{{ user?.role }}</span>
          <span class="badge bg-secondary mt-1 ms-1" *ngIf="user?.hubName">
            <i class="bi bi-shield-fill me-1"></i>{{ user?.hubName }}
          </span>
        </div>
      </div>
    </div>

    <!-- Quick Nav -->
    <h6 class="text-uppercase text-muted fw-bold mb-3 small">Hub Actions</h6>
    <div class="row row-cols-2 g-3">

      <div class="col">
        <div class="card border-0 shadow-sm text-center p-4 h-100">
          <i class="bi bi-box-seam-fill fs-2 text-success mb-2"></i>
          <div class="fw-semibold">Book Parcel</div>
        </div>
      </div>

      <div class="col">
        <div class="card border-0 shadow-sm text-center p-4 h-100">
          <i class="bi bi-list-check fs-2 text-primary mb-2"></i>
          <div class="fw-semibold">Hub Parcels</div>
        </div>
      </div>

    </div>
  </div>
</div>
